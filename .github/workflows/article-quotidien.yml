# Chaque jour : un nouvel article SEO rédigé puis publié.
#
# 1. Si la file _articles/file/ est vide, l'article du jour est RÉDIGÉ par
#    l'API OpenAI à partir du prochain sujet de _articles/sujets.json
#    (faits produit issus de llms.txt, validation stricte à la sortie).
# 2. Le plus ancien article de la file est publié : déplacement à la racine,
#    ajout au sitemap sans modifier le pied de page de l'accueil, commit,
#    push — Render redéploie automatiquement.
# 3. File ET sujets vides : échec visible (pensez à alimenter sujets.json).
#
# Prérequis : secret OPENAI_API_KEY (dépôt → Settings → Secrets and
# variables → Actions). Déclenchement manuel possible ici même.

name: Article quotidien

on:
  schedule:
    - cron: "30 9 * * *" # 09:30 UTC = 11h30, tous les jours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: article-quotidien
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer l'article du jour si la file est vide
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$(ls -A _articles/file 2>/dev/null)" ]; then
            echo "File vide : génération de l'article du jour."
            node scripts/generer-article.mjs
          else
            echo "Un article attend déjà dans la file : publication seule."
          fi

      - name: Publier l'article en tête de file
        id: publication
        run: |
          SORTIE=$(node scripts/publier-article.mjs)
          echo "$SORTIE"
          if echo "$SORTIE" | grep -q "^RIEN_A_PUBLIER"; then
            echo "rien=true" >> "$GITHUB_OUTPUT"
          else
            echo "rien=false" >> "$GITHUB_OUTPUT"
            TITRE=$(echo "$SORTIE" | grep "^TITRE=" | cut -d= -f2-)
            echo "titre=$TITRE" >> "$GITHUB_OUTPUT"
          fi

      - name: Commiter et pousser
        if: steps.publication.outputs.rien == 'false'
        run: |
          git config user.name "haria-bot"
          git config user.email "bot@haria-chatbot.com"
          git add -A
          git commit -m "Article SEO : ${{ steps.publication.outputs.titre }}"
          git push
