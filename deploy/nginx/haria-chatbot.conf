# Landing haria-chatbot.com — Nginx sur le VPS OVH (141.95.162.100).
# Sur le serveur : /etc/nginx/sites-available/haria-chatbot
#                  + lien dans /etc/nginx/sites-enabled/
# Procédure complète : deploy/README.md du dépôt.
#
# Uniquement derrière le proxy orange de Cloudflare : ufw n'ouvre le 443
# qu'aux IP de Cloudflare, le port 80 est fermé (http -> https est fait par
# Cloudflare, « Always Use HTTPS »). Certificat d'origine Cloudflare.
# PAS de default_server ici : celui du 443 appartient au site hariastudio.
#
# En-têtes : copie de ce que Render envoyait réellement en ligne (dashboard),
# pas de render.yaml, qui n'était pas appliqué. Seul ajout : s-maxage=300
# partout, pour que Cloudflare ne garde une copie que 5 min (Render vidait
# son cache à chaque déploiement, Cloudflare ne le fera pas).

# Cache-Control selon le chemin (map = niveau http, nom préfixé pour ne pas
# entrer en collision avec la config de hariastudio).
map $uri $haria_chatbot_cache {
    ~^/assets/  "public, max-age=86400, s-maxage=300";
    ~^/images/  "public, max-age=86400, s-maxage=300";
    default     "public, max-age=0, s-maxage=300";
}

# www -> domaine nu (301)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.haria-chatbot.com;

    ssl_certificate     /etc/ssl/cloudflare/haria-chatbot.pem;
    ssl_certificate_key /etc/ssl/cloudflare/haria-chatbot.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    access_log /var/log/nginx/haria-chatbot.access.log;
    error_log  /var/log/nginx/haria-chatbot.error.log;

    return 301 https://haria-chatbot.com$request_uri;
}

# Le site. vps.haria-chatbot.com sert aux essais avant la bascule du DNS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name haria-chatbot.com vps.haria-chatbot.com;

    ssl_certificate     /etc/ssl/cloudflare/haria-chatbot.pem;
    ssl_certificate_key /etc/ssl/cloudflare/haria-chatbot.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    access_log /var/log/nginx/haria-chatbot.access.log;
    error_log  /var/log/nginx/haria-chatbot.error.log;

    root /var/www/haria-chatbot;
    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript;
    # Redirections relatives (Location: /guides) : pas de souci de nom
    # d'hôte ou de schéma derrière Cloudflare.
    absolute_redirect off;

    # En-têtes communs. Aucune location ci-dessous ne fait d'add_header,
    # sinon elle perdrait tous ceux-ci (héritage Nginx).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Report-Only comme sur Render : signale dans la console, ne bloque rien.
    # Domaines tiers : Meta Pixel, Cal.com, widget Haria (hariastudio.com),
    # Google Fonts.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://app.cal.com https://hariastudio.com; style-src 'self' 'unsafe-inline' https://app.cal.com https://fonts.googleapis.com; img-src 'self' data: https://www.facebook.com https://app.cal.com https://hariastudio.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.facebook.com https://connect.facebook.net https://app.cal.com https://api.cal.com https://hariastudio.com; frame-src https://app.cal.com https://cal.com https://www.facebook.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control $haria_chatbot_cache always;

    error_page 404 /404.html;

    # --- Jamais servis (404 avec la page 404 du site) ---
    # Fichiers et dossiers cachés : .git, .github, .gitignore…
    location ~ /\. {
        return 404;
    }
    # Outillage du dépôt : pipeline d'articles, sauvegardes, déploiement.
    location ~ ^/(scripts|_articles|backup|deploy|node_modules)(/|$) {
        return 404;
    }
    # Fichiers de travail à la racine ou ailleurs (CLAUDE.md, AGENTS.md,
    # render.yaml, package.json…).
    location ~* (\.(md|ya?ml|mjs|sh)|/package(-lock)?\.json)$ {
        return 404;
    }

    # --- Pages ---
    location = / {
        try_files /index.html =404;
    }
    # Adresse avec barre finale : /guides/ -> 301 /guides si guides.html
    # existe (Render répondait 200, mais sans CSS : les chemins relatifs
    # cassaient). Les dossiers (/images/…) -> 404, jamais de listing ni 403.
    location ~ ^(?<haria_sans_barre>/.+)/$ {
        if (-f $document_root$haria_sans_barre.html) {
            return 301 $haria_sans_barre$is_args$args;
        }
        return 404;
    }
    # /guides sert guides.html, comme Render.
    location / {
        try_files $uri $uri.html =404;
    }
}
