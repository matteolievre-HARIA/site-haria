services:
  - type: web
    name: haria
    env: static
    staticPublishPath: .
    buildCommand: ""
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        # Domaines tiers autorisés : Meta Pixel (connect.facebook.net / www.facebook.com),
        # Cal.com (embed de reservation), le widget Haria (hariastudio.com)
        # et Google Fonts (feuille de style googleapis + fichiers de police gstatic).
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://connect.facebook.net https://app.cal.com https://hariastudio.com; style-src 'self' 'unsafe-inline' https://app.cal.com https://fonts.googleapis.com; img-src 'self' data: https://www.facebook.com https://app.cal.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.facebook.com https://connect.facebook.net https://app.cal.com https://api.cal.com https://hariastudio.com; frame-src https://app.cal.com https://cal.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*.css
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.js
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.png
        name: Cache-Control
        value: public, max-age=604800
